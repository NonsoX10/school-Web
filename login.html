<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Academy - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="school.css">
</head>

<body>

    <header class="navbar">
        <p class="logo">Apex Academy</p>

        <nav class="navlinks">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#course">Course</a>
            <a href="login.html">Parent Login</a>
            <a href="signup.html">Parent Sign-up</a>
        </nav>
    </header>

    <div class="content">

        <img src="./pictures/download.jpg" alt="login-Background" class="loging-img">
        
        <div class="form-box">
            <h1>Welcome to Apex Academy</h1>
            <h2>Sign In</h2>
            <p>Enter your details below to sign-in</p>

            <!-- WRAPPED IN A FORM TAG -->
            <form>
                <input type="text" placeholder="Email or Student ID" required> <br>
                <input type="password" placeholder="Password" required> <br>
                <a href="#">Forgot Password?</a> <br>
                <button type="submit">Sign In</button>
            </form>
        </div>

    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle">Success!</h2>
            <p id="modalMessage">Your action was successful.</p>
            <button id="modalCloseBtn" type="button">OK</button>
        </div>
    </div>

    <!-- Link your JS file once at the bottom -->
    <script src="js/web.js"></script>
</body>

</html>
